{% extends 'base.html' %}
{% load static %}

{% block title %}Live Market Data{% endblock %}

{% block content %}
    <div class="container mt-4">
        <h2 class="text-center mb-xl-4">📈 Live Market Data</h2>
        <div class="container text-center mt-5">
            <div class="d-flex justify-content-between mb-sm-1">
                <form class="subscribe">
                    <div class="d-flex align-items-center">
                            <input type="text" class="form-control border border-success me-1" id="subscribe-input" placeholder="Subscribe" aria-label="subscribe">
                            <button class="border border-success rounded" style="height: 35px;" type="submit">Subscribe</button> 
                    </div>
                </form>
                <form class="unsubscribe">
                    <div class="d-flex align-items-center">
                        <input type="text" class="form-control border-danger-subtle me-1" id="unsubscribe-input" placeholder="Unsubscribe" aria-label="Unsubscribe">
                        <button class="border border-danger-subtle rounded" style="height: 35px;" type="submit">Unsubscribe</button>
                    </div>
                </form>
            </div>
        </div>
        <table class="table table-bordered table-striped table-hover">
            <thead class="table-primary">
                <tr>
                    <th>Token</th>
                    <th>Symbol</th>
                    <th>Exchange Type</th>
                    <th>LTP</th>
                    <th>Sequence No.</th>
                    <th>Exchange Timestamp</th>
                    <th>Current Timestamp</th>
                    <th>Diff Timestamp</th>
                    <th>Subscription Mode</th>
                </tr>
            </thead>
            <tbody id="market_data">
                <tr><td colspan="9" class="text-center">Waiting for updates...</td></tr>
            </tbody>
        </table>
    </div>

    <script src="{% static 'js/market_data.js' %}"></script>
{% endblock %}
