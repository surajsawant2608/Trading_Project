{% extends 'base.html' %}

{% block title %}Login - My Trading App{% endblock %}

{% block content %}
  <div class="container mt-5">
    <div class="content">
      <h2 class="text-center mb-4">Login</h2>
      
      <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        
        <button type="submit" class="btn-class">Login</button>
      </form>

      {% if messages %}
        <div class="alert alert-warning mt-3">
          {% for message in messages %}
            <p>{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    </div>
  </div>
{% endblock %}

{% block extra_css %}
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins&display=swap');

    body {
        font-family: 'Poppins', sans-serif;
        background-color: #00ac96;
        margin: 0;
        padding: 0;
        height: 100vh;
    }

    .cd__main {
        background: #00ac96 !important;
    }

    .content {
        margin: 8%;
        background-color: #fff;
        padding: 4rem 1rem 4rem 1rem;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        max-width: 800px;
        margin-left: auto;
        margin-right: auto;
    }

    .signin-text {
        font-style: normal;
        font-weight: 500 !important;
        color: #333;
    }

    .form-control {
        display: block;
        width: 100%;
        font-size: 1.3rem;
        font-weight: 350;
        line-height: 1.5;
        border-color: #00ac96 !important;
        border-style: solid !important;
        border-width: 0 0 1px 0 !important;
        padding: 0px !important;
        color: #495057;
        height: auto;
        border-radius: 0;
        background-color: #fff;
        background-clip: padding-box;
    }

    .form-control:focus {
        color: #495057;
        background-color: #fff;
        border-color: #00ac96 !important;
        outline: 0;
        box-shadow: 0 0 5px rgba(0, 172, 150, 0.4);
    }
        /* Custom tooltip styling */
    .tooltip-inner {
        font-size: 1rem; /* Match the font size of .form-control */
        font-weight: 400; /* Adjust if you want a different weight */
    }

    /* Optional: To control the tooltip arrow */
    .tooltip-arrow {
        border-width: 5px;
    }
  
    .btn-class {
        border-color: #00ac96;
        color: #00ac96;
        background-color: transparent;
        padding: 10px 20px;
        border-radius: 4px;
        font-weight: 800;
        width: 100%;
    }

    .btn-class:hover {
        background-color: #00ac96;
        color: #fff;
        border-color: #00ac96;
        box-shadow: 0 0 8px rgba(0, 172, 150, 0.5);
    }

    @media (max-width: 768px) {
        .content {
            margin: 5%;
            padding: 2rem 1rem 2rem 1rem;
        }

        .btn-class {
            width: 100%;
            padding: 12px;
        }
    }
  </style>
{% endblock %}
